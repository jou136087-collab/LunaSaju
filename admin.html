<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>방문 현황 — LUNE</title>
<meta name="theme-color" content="#F4F1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23161513' stroke-width='1.5'/%3E%3Cpath d='M16 5a11 11 0 000 22z' fill='%23161513'/%3E%3C/svg%3E">
</head>
<body data-page="admin">

<canvas id="sky" class="sky" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<a class="skip" href="#main">본문으로 건너뛰기</a>

<header class="topbar" id="topbar"></header>
<aside class="side" id="sidebar"></aside>
<div class="scrim" id="scrim" hidden></div>

<main class="main" id="main" tabindex="-1">
  <section class="section section--lead">
    <div class="wrap">
      <div class="sec-head">
        <span class="micro">관리자</span>
        <h2 class="sec-title">방문 현황</h2>
        <p class="sec-desc">
          로그인한 사람만 명단에 남습니다. 로그인하지 않은 방문은 <b>숫자로만</b> 세며
          개인을 식별할 수 있는 값은 저장하지 않습니다.
        </p>
      </div>

      <div id="adminGate">
        <div class="card">
          <p class="card__note" id="adminGateMsg">확인 중…</p>
        </div>
      </div>

      <div id="adminBody" hidden>
        <div class="stats" id="statCards"></div>

        <div class="card">
          <span class="micro">최근 14일</span>
          <h3 class="card__title">일별 방문</h3>
          <div class="daily" id="dailyChart"></div>
        </div>

        <div class="card">
          <span class="micro">로그인 사용자</span>
          <h3 class="card__title">방문자 명단</h3>
          <div class="table-scroll">
            <table class="dtable" id="userTable">
              <thead>
                <tr><th>이름</th><th>이메일</th><th>가입</th><th>최근 접속</th><th class="num">방문</th><th>명식</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <p class="card__note" id="userNote"></p>
        </div>

        <div class="result__actions">
          <button class="btn btn--ghost" type="button" id="reloadBtn">새로고침</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>
</main>

<script src="assets/js/calendar.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/sky.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
